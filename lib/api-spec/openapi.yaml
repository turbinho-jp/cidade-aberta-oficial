openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Cidade Aberta - Plataforma de Participação Cidadã
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: demands
    description: Citizen demands and issues
  - name: comments
    description: Comments on demands
  - name: confirmations
    description: Community confirmations
  - name: categories
    description: Demand categories
  - name: service-orders
    description: Service orders
  - name: teams
    description: Field teams
  - name: departments
    description: City departments/secretaries
  - name: public-works
    description: Public works and projects
  - name: dashboard
    description: Public dashboard and stats
  - name: users
    description: User profiles
  - name: neighborhoods
    description: Neighborhoods

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new citizen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  # DEMANDS
  /demands:
    get:
      operationId: listDemands
      tags: [demands]
      summary: List public demands
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: neighborhoodId
          in: query
          schema:
            type: ["integer", "null"]
        - name: departmentId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of demands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandListResponse"

    post:
      operationId: createDemand
      tags: [demands]
      summary: Create a new demand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemandInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"

  /demands/{id}:
    get:
      operationId: getDemand
      tags: [demands]
      summary: Get demand details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Demand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemandDetail"
        "404":
          description: Not found

    patch:
      operationId: updateDemand
      tags: [demands]
      summary: Update demand (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemandUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"

  /demands/{id}/timeline:
    get:
      operationId: getDemandTimeline
      tags: [demands]
      summary: Get public timeline of a demand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"

  /demands/{id}/status:
    patch:
      operationId: updateDemandStatus
      tags: [demands]
      summary: Update demand status (admin/secretary)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Demand"

  # COMMENTS
  /demands/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments on a demand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

    post:
      operationId: createComment
      tags: [comments]
      summary: Add a comment to a demand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment (moderation)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # CONFIRMATIONS
  /demands/{id}/confirm:
    post:
      operationId: confirmDemand
      tags: [confirmations]
      summary: Confirm a demand ("Também acontece comigo")
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Confirmation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationResult"

    delete:
      operationId: unconfirmDemand
      tags: [confirmations]
      summary: Remove confirmation from demand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # CATEGORIES
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  # NEIGHBORHOODS
  /neighborhoods:
    get:
      operationId: listNeighborhoods
      tags: [neighborhoods]
      summary: List all neighborhoods
      responses:
        "200":
          description: Neighborhoods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Neighborhood"

  # SERVICE ORDERS
  /service-orders:
    get:
      operationId: listServiceOrders
      tags: [service-orders]
      summary: List service orders (public/admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: teamId
          in: query
          schema:
            type: ["integer", "null"]
        - name: demandId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Service orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceOrder"

    post:
      operationId: createServiceOrder
      tags: [service-orders]
      summary: Create a service order from a demand (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceOrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"

  /service-orders/{id}:
    get:
      operationId: getServiceOrder
      tags: [service-orders]
      summary: Get service order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"

    patch:
      operationId: updateServiceOrder
      tags: [service-orders]
      summary: Update service order status/team (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceOrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOrder"

  # TEAMS
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List field teams
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"

    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  # DEPARTMENTS
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List city departments/secretaries
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"

  /departments/{id}/stats:
    get:
      operationId: getDepartmentStats
      tags: [departments]
      summary: Get stats for a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentStats"

  # PUBLIC WORKS
  /public-works:
    get:
      operationId: listPublicWorks
      tags: [public-works]
      summary: List public works and projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Public works
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicWork"

    post:
      operationId: createPublicWork
      tags: [public-works]
      summary: Create public work (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicWorkInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWork"

  /public-works/{id}:
    get:
      operationId: getPublicWork
      tags: [public-works]
      summary: Get public work details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWork"

  # DASHBOARD
  # Envio de fotos: POST /demands/{id}/attachments e POST /public-works/{id}/attachments
  # recebem a imagem CRUA no corpo (Content-Type image/jpeg|png|webp) e devolvem um Attachment.
  # Ficam fora deste spec de propósito: o gerador não sabe enviar binário. O frontend usa
  # artifacts/cidade-aberta/src/lib/attachments.ts.
  /attachments/{id}:
    delete:
      operationId: deleteAttachment
      tags: [attachments]
      summary: Remove uma foto (quem enviou, autor da demanda ou gestão)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get public dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/by-neighborhood:
    get:
      operationId: getDemandsByNeighborhood
      tags: [dashboard]
      summary: Get demand counts by neighborhood
      responses:
        "200":
          description: Demands by neighborhood
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NeighborhoodStats"

  /dashboard/by-category:
    get:
      operationId: getDemandsByCategory
      tags: [dashboard]
      summary: Get demand counts by category
      responses:
        "200":
          description: Demands by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStats"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent platform activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /dashboard/top-demands:
    get:
      operationId: getTopDemands
      tags: [dashboard]
      summary: Get most confirmed demands
      responses:
        "200":
          description: Top demands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Demand"

  # USERS / PROFILES
  /users/{id}/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get citizen profile and history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/ranking:
    get:
      operationId: getCitizenRanking
      tags: [users]
      summary: Get citizen participation ranking
      description: >
        Sem filtros devolve o ranking geral (total acumulado). Com `period=month` e/ou
        `neighborhoodId`, `points` é o total daquele período/bairro.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: period
          in: query
          schema:
            type: string
            enum: [all, month]
        - name: neighborhoodId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenRankItem"

  /users/me/points:
    get:
      operationId: getMyPointHistory
      tags: [users]
      summary: Histórico de pontos da pessoa autenticada
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Pontos ganhos, do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PointTransaction"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # AUTH
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        password:
          type: string
          minLength: 6
        phone:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, name, email, role, points, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [citizen, admin, secretary, moderator]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        points:
          type: integer
        demandsCount:
          type: integer
        confirmationsCount:
          type: integer
        commentsCount:
          type: integer
        createdAt:
          type: string

    # DEMAND
    Demand:
      type: object
      required: [id, title, description, status, categoryId, neighborhoodId, address, lat, lng, confirmationsCount, commentsCount, createdAt, authorId]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, under_review, approved, in_progress, completed, rejected, closed]
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, urgent, null]
        categoryId:
          type: integer
        category:
          $ref: "#/components/schemas/Category"
        neighborhoodId:
          type: integer
        neighborhood:
          $ref: "#/components/schemas/Neighborhood"
        departmentId:
          type: ["integer", "null"]
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        photoUrl:
          type: ["string", "null"]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        confirmationsCount:
          type: integer
        commentsCount:
          type: integer
        isConfirmedByMe:
          type: boolean
        authorId:
          type: integer
        authorName:
          type: string
        publicResponse:
          type: ["string", "null"]
        isApproved:
          type: boolean
          description: false enquanto a demanda aguarda moderação (só autor e gestão a veem)
        createdAt:
          type: string
        updatedAt:
          type: string

    DemandDetail:
      type: object
      required: [id, title, description, status, categoryId, neighborhoodId, address, lat, lng, confirmationsCount, commentsCount, createdAt, authorId, timeline]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, under_review, approved, in_progress, completed, rejected, closed]
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, urgent, null]
        categoryId:
          type: integer
        category:
          $ref: "#/components/schemas/Category"
        neighborhoodId:
          type: integer
        neighborhood:
          $ref: "#/components/schemas/Neighborhood"
        departmentId:
          type: ["integer", "null"]
        department:
          $ref: "#/components/schemas/Department"
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        photoUrl:
          type: ["string", "null"]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        confirmationsCount:
          type: integer
        commentsCount:
          type: integer
        isConfirmedByMe:
          type: boolean
        authorId:
          type: integer
        authorName:
          type: string
        publicResponse:
          type: ["string", "null"]
        isApproved:
          type: boolean
          description: false enquanto a demanda aguarda moderação (só autor e gestão a veem)
        createdAt:
          type: string
        updatedAt:
          type: string
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
        serviceOrders:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOrder"

    Attachment:
      type: object
      required: [id, url, mimeType, sizeBytes]
      properties:
        id:
          type: integer
        url:
          type: string
          description: Caminho da imagem (GET, público, cache imutável)
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer

    DemandListResponse:
      type: object
      required: [demands, total]
      properties:
        demands:
          type: array
          items:
            $ref: "#/components/schemas/Demand"
        total:
          type: integer

    DemandInput:
      type: object
      required: [title, description, categoryId, neighborhoodId, address, lat, lng]
      properties:
        title:
          type: string
          minLength: 5
        description:
          type: string
          minLength: 10
        categoryId:
          type: integer
        neighborhoodId:
          type: integer
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        photoUrl:
          type: ["string", "null"]

    DemandUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        publicResponse:
          type: ["string", "null"]

    StatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, under_review, approved, in_progress, completed, rejected, closed]
        note:
          type: ["string", "null"]
        publicResponse:
          type: ["string", "null"]

    TimelineEvent:
      type: object
      required: [id, demandId, event, createdAt]
      properties:
        id:
          type: integer
        demandId:
          type: integer
        event:
          type: string
        description:
          type: ["string", "null"]
        actorName:
          type: ["string", "null"]
        actorRole:
          type: ["string", "null"]
        statusFrom:
          type: ["string", "null"]
        statusTo:
          type: ["string", "null"]
        isPublic:
          type: boolean
        createdAt:
          type: string

    # COMMENT
    Comment:
      type: object
      required: [id, demandId, content, authorId, authorName, createdAt, isModerated]
      properties:
        id:
          type: integer
        demandId:
          type: integer
        content:
          type: string
        authorId:
          type: integer
        authorName:
          type: string
        authorAvatarUrl:
          type: ["string", "null"]
        isModerated:
          type: boolean
        isOfficial:
          type: boolean
        createdAt:
          type: string

    CommentInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    # CONFIRMATION
    ConfirmationResult:
      type: object
      required: [confirmed, total]
      properties:
        confirmed:
          type: boolean
        total:
